name: CD Pipeline – Branche prod

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  CONTAINER_NAME: intranet-newdeal-prod

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Scan sécurité avant déploiement
  # ─────────────────────────────────────────────
  security-scan:
    name: 🔒 Scan Sécurité (prod)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Puller l'image prod
        run: docker pull ${{ env.IMAGE_NAME }}:dev-latest

      - name: Scan vulnérabilités avec Trivy (BLOQUANT sur CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:dev-latest
          format: table
          exit-code: 1 # Bloque le pipeline si CRITICAL détecté
          ignore-unfixed: true
          severity: CRITICAL

      - name: Scan secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────
  # JOB 2 : Déploiement sur runner self-hosted (runner_prod)
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Déploiement Production
    runs-on: [self-hosted, runner_prod]
    needs: security-scan

    steps:
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Puller la dernière image
        run: docker pull ${{ env.IMAGE_NAME }}:dev-latest

      - name: Arrêter et supprimer l'ancien container (si existant)
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm   ${{ env.CONTAINER_NAME }} || true

      - name: Démarrer le nouveau container sur le port 80
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            -p 80:80 \
            ${{ env.IMAGE_NAME }}:dev-latest

      - name: Vérifier que le container tourne
        run: |
          sleep 3
          docker ps | grep ${{ env.CONTAINER_NAME }}
          echo "✅ Intranet déployé et accessible sur le port 80"
