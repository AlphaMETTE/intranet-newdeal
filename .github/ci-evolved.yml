name: CI Pipeline Évoluée – nginx:alpine3.23-slim + Notifications

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Build avec image slim
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build Image (nginx:alpine3.23-slim)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build avec image slim
        run: |
          docker build \
            --build-arg BASE_IMAGE=nginx:alpine3.23-slim \
            -t ${{ env.IMAGE_NAME }}:slim-${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:slim-latest \
            .

      - name: Sauvegarder l'image
        run: docker save ${{ env.IMAGE_NAME }}:slim-latest -o image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-slim
          path: image.tar

  # ─────────────────────────────────────────────
  # JOB 2 : Scan sécurité – BLOQUE si CRITICAL
  # ─────────────────────────────────────────────
  security-scan:
    name: 🔒 Scan Sécurité (CRITICAL bloquant)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-slim

      - name: Charger l'image Docker
        run: docker load -i image.tar

      - name: Scan Trivy – BLOQUE si vulnérabilité CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:slim-latest
          format: table
          exit-code: 1 # ← Pipeline s'arrête si CRITICAL trouvé
          ignore-unfixed: true
          severity: CRITICAL

      - name: Scan Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────
  # JOB 3 : Push vers Docker Hub
  # ─────────────────────────────────────────────
  push:
    name: 📦 Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-slim

      - name: Charger l'image Docker
        run: docker load -i image.tar

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image slim
        run: |
          docker push ${{ env.IMAGE_NAME }}:slim-${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:slim-latest

  # ─────────────────────────────────────────────
  # NOTIFICATION EMAIL – Succès
  # ─────────────────────────────────────────────
  notify-success:
    name: ✅ Notification Succès
    runs-on: ubuntu-latest
    needs: push
    if: success()

    steps:
      - name: Envoyer email de succès
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [CI] Pipeline réussi – Intranet New Deal"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CI/CD AFM TECH <${{ secrets.MAIL_USERNAME }}>"
          body: |
            ✅ Pipeline CI terminé avec succès !

            📦 Projet   : Intranet New Deal Technologique
            🌿 Branche  : ${{ github.ref_name }}
            🔖 Commit   : ${{ github.sha }}
            👤 Auteur   : ${{ github.actor }}
            🕒 Date     : ${{ github.event.head_commit.timestamp }}

            L'image Docker a été construite, scannée et poussée sur Docker Hub.
            → Image : ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:slim-latest

  # ─────────────────────────────────────────────
  # NOTIFICATION EMAIL – Échec
  # ─────────────────────────────────────────────
  notify-failure:
    name: ❌ Notification Échec
    runs-on: ubuntu-latest
    needs: [build, security-scan, push]
    if: failure()

    steps:
      - name: Envoyer email d'échec
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [CI] Pipeline échoué – Intranet New Deal"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CI/CD AFM TECH <${{ secrets.MAIL_USERNAME }}>"
          body: |
            ❌ Pipeline CI en échec !

            📦 Projet   : Intranet New Deal Technologique
            🌿 Branche  : ${{ github.ref_name }}
            🔖 Commit   : ${{ github.sha }}
            👤 Auteur   : ${{ github.actor }}
            🕒 Date     : ${{ github.event.head_commit.timestamp }}

            ⚠️ Vérifier les logs GitHub Actions pour identifier le problème.
            → https://github.com/${{ github.repository }}/actions
